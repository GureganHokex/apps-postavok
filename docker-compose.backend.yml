services:
  postgres:
    image: postgres:16-alpine
    container_name: apps-postavok-postgres
    environment:
      POSTGRES_DB: apps_postavok
      POSTGRES_USER: apps_postavok
      POSTGRES_PASSWORD: apps_postavok
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apps_postavok -d apps_postavok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    container_name: apps-postavok-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/env.example
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      EXCEL_PARSER_PIPELINE_V2: "true"
      PARSER_LEGACY_FORCE: "false"
      PARSER_SHADOW_MODE: "true"
      DB_ENGINE: "postgresql"
      DB_NAME: "apps_postavok"
      DB_USER: "apps_postavok"
      DB_PASSWORD: "apps_postavok"
      DB_HOST: "postgres"
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media
    restart: unless-stopped

volumes:
  postgres_data:
