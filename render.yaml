services:
  - type: web
    name: apps-postavok-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash entrypoint.sh
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: "apps-postavok-backend.onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://apps-postavok.vercel.app,https://apps-postavok-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://apps-postavok.vercel.app"
      - key: DB_ENGINE
        value: postgresql
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.jvmgqwtcwhcmexmszreg
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: aws-1-eu-central-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PARSER_SHADOW_MODE
        value: "false"
      - key: EXCEL_PARSER_PIPELINE_V2
        value: "false"
      - key: PARSER_LEGACY_FORCE
        value: "false"
      # Free tier: один воркер = меньше OOM при парсинге; на платном плане можно 2–3.
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "1200"
